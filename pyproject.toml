[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-market-analysis"
version = "1.0.0"
description = "Comparative short-term rental data preparation for Zurich and Milan."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2,<5.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.14",
]

[project.scripts]
build-rental-dataset = "rental_market_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
